name: Podqi
description: >-
  Podqi is an AI-native intellectual property and brand protection platform that
  automatically detects and removes brand infringements across digital
  platforms. It scans major marketplaces, storefronts, and domains for
  counterfeit listings, stolen imagery, fake products, and copycat sites, then
  packages evidence and files takedowns at scale with minimal human
  intervention. The company reports roughly 95% AI automation with same-day
  detection and an average resolution time of about 1.2 days, and also operates
  Brandsweep.ai, a free public brand-protection scanning tool. Podqi serves
  brand owners, entertainment and creative companies, e-commerce sellers, and
  law firms. It was surfaced as a portfolio company of General Catalyst and
  added to the API Evangelist network; as of this enrichment pass Podqi
  publishes no public API, developer documentation, or SDK surface.
